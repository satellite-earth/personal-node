version: "3.7"

volumes:
  i2pd: {}
  tor-config: {}
  tor-data: {}

services:
  i2pd:
    image: purplei2p/i2pd:release-2.44.0@sha256:d154a599793c393cf9c91f8549ba7ece0bb40e5728e1813aa6dd4c210aa606f6
    user: "root"
    command: --sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --socksproxy.enabled=true --socksproxy.address=0.0.0.0 --socksproxy.port=4447 --loglevel=error
    restart: on-failure
    volumes:
      - i2pd:/home/i2pd/data

  tor:
    image: dockurr/tor
    volumes:
      - tor-config:/etc/tor
      - tor-data:/var/lib/tor

  web:
    image: ghcr.io/satellite-earth/personal-node:0.4.1
    build: .
    restart: on-failure
    stop_grace_period: 1m
    init: true
    volumes:
      - ./data:/data
    ports:
      - 3000:3000
    environment:
      DATA_PATH: /data
      REDIRECT_APP_URL: https://app.satellite.earth/
      TOR_PROXY_TYPE: "SOCKS5"
      TOR_PROXY: "tor:9050"
      I2P_SAM_ADDRESS: "i2pd:7656"
      I2P_PROXY: "i2pd:4447"
      I2P_PROXY_TYPE: "SOCKS5"
